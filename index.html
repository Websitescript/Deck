<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Terminal | New Tab</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="term-window">
    <div class="term-titlebar">
      <div class="term-tab" data-open-terminal>
        <span class="tab-dot"></span>Terminal | New Tab
      </div>
      <span class="term-clock" id="term-clock">--:--:-- --</span>
      <div class="term-controls">
        <button class="ctrl" id="ctrl-min" aria-label="Minimize">&#x2013;</button>
        <button class="ctrl" id="ctrl-max" aria-label="Maximize">&#x25A1;</button>
        <button class="ctrl close" id="ctrl-close" aria-label="Close">&#x2715;</button>
      </div>
    </div>

    <div class="term-body">
      <div class="dashboard-view" id="dashboardView">
        <div class="dash-header">
          <div class="dash-avatar" id="dash-avatar">?</div>
          <div class="dash-header-text">
            <div class="dash-greeting">Welcome back, <span id="dash-username">guest</span></div>
            <div class="dash-date" id="dash-date"></div>
          </div>
          <button type="button" class="open-term-btn" data-open-terminal>&gt;_ Terminal</button>
          <span class="dash-version" id="dash-version"></span>
        </div>

        <div class="dash-stats" id="dash-stats"></div>

        <div class="dash-grid">

          <section class="dash-section links">
            <div class="dash-head">QUICK LINKS</div>
            <div class="link-tiles" id="dash-links-body"></div>
          </section>

          <section class="dash-section folders">
            <div class="dash-head">FOLDERS</div>
            <div class="dash-body" id="dash-folders-body"></div>
          </section>

          <section class="dash-section reminders">
            <div class="dash-head">REMINDERS</div>
            <div class="dash-body" id="dash-reminders-body"></div>
          </section>

          <section class="dash-section calendar">
            <div class="dash-head" id="dash-calendar-month">CALENDAR</div>
            <div id="dash-calendar-body"></div>
          </section>

          <section class="dash-section notes">
            <div class="dash-head">SAVED NOTES</div>
            <div class="dash-body" id="dash-notes-body"></div>
          </section>

        </div>
      </div>
    </div>

    <div class="term-modal-overlay" id="termModalOverlay" hidden>
      <div class="term-modal">
        <div class="term-modal-header">
          <span class="term-modal-title">&gt;_ Terminal</span>
          <button type="button" class="term-modal-close" data-close-terminal aria-label="Close terminal">&#x2715;</button>
        </div>
        <div class="term-output" id="term-output"></div>
        <div class="term-inputline">
          <span class="prompt" id="term-prompt">PS C:\Users\guest\Dashboard&gt;</span>
          <input id="term-input" autocomplete="off" spellcheck="false" autocapitalize="off" />
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/persist.js"></script>
  <script src="js/state.js"></script>
  <script src="js/terminal.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/commands.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
